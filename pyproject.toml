[project]
name = "russells-baseagent"
version = "0.1.0"
description = "Russell's BaseAgent: a small, subclassable ReAct agent core with a web chat room."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.99",
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
baseagent-server = "baseagent.server.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baseagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

